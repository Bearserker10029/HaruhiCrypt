[package]
name = "haruhi-crypt"
version = "0.2.0"
edition = "2021"
description = "HaruhiCrypt v2 - Encryption using the Haruhi Problem (Superpermutations)"
license = "MIT"
repository = ""
keywords = ["cryptography", "encryption", "permutation", "haruhi"]
categories = ["cryptography"]

[dependencies]
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
digest = "0.10"
rfd = "0.14"
chrono = "0.4"
image = { version = "0.24", default-features = false, features = ["jpeg"] }
winapi = { version = "0.3", features = ["winuser", "windef", "wingdi", "combaseapi", "objbase", "shobjidl", "uxtheme", "minwindef"] }
rodio = { version = "0.19", default-features = false, features = ["minimp3"] }
argon2 = "0.5"
chacha20 = "0.9"

[dependencies.egui]
version = "0.25"

[dependencies.eframe]
version = "0.25"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true